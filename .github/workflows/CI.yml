name: CI
on:
  push:
    branches:
      - main
    tags: "*"
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu, windows and macos, latest Julia versions (mac on arm, others on x64)
          - os: ubuntu-latest
            arch: x64
            version: "1"
          - os: windows-latest
            arch: x64
            version: "1"
          # macOS - aarch64 (ARM) only, both Julia versions
          - os: macOS-latest
            arch: aarch64
            version: "1"
          # Also test Julia 1.10 on windows for retrocompatibility (most common OS)
          - os: windows-latest
            arch: x64
            version: "1.10"
    steps:
      - uses: actions/checkout@v7
      - name: Check out PlantSimEngine
        uses: actions/checkout@v7
        with:
          repository: VirtualPlantLab/PlantSimEngine.jl
          ref: 82786fba91fad644d8068d75afc64d88282400c4
          path: .ci-deps/PlantSimEngine
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
        with:
          # v2 invalidates an incomplete cache saved by a cancelled dependency setup.
          cache-name: "julia-cache-v2;workflow=${{ github.workflow }};job=${{ github.job }}"
          save-always: false
      - uses: julia-actions/julia-buildpkg@v1
      - name: Configure test environment
        shell: julia --project=test --color=yes {0}
        run: |
          using Pkg
          Pkg.develop([
              PackageSpec(path=pwd()),
              PackageSpec(path=joinpath(pwd(), ".ci-deps", "PlantSimEngine")),
          ])
          Pkg.instantiate()
      - name: Run tests
        shell: julia --project=test --color=yes --check-bounds=yes --depwarn=yes --code-coverage=user {0}
        run: include(joinpath(pwd(), "test", "runtests.jl"))
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      actions: write # needed to allow julia-actions/cache to proactively delete old caches that it has created
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - name: Check out PlantSimEngine
        uses: actions/checkout@v7
        with:
          repository: VirtualPlantLab/PlantSimEngine.jl
          ref: 82786fba91fad644d8068d75afc64d88282400c4
          path: .ci-deps/PlantSimEngine
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - uses: julia-actions/cache@v3
        with:
          save-always: false
      - name: Configure doc environment
        shell: julia --project=docs --color=yes {0}
        run: |
          using Pkg
          Pkg.develop([
              PackageSpec(path=pwd()),
              PackageSpec(path=joinpath(pwd(), ".ci-deps", "PlantSimEngine")),
          ])
          Pkg.instantiate()
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
      - name: Run doctests
        shell: julia --project=docs --color=yes {0}
        run: |
          using Documenter: DocMeta, doctest
          using PlantGeom
          DocMeta.setdocmeta!(PlantGeom, :DocTestSetup, :(using PlantGeom); recursive=true)
          doctest(PlantGeom)
